services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medallion
      POSTGRES_PASSWORD: medallion
      POSTGRES_DB: medallion
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medallion"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: medallion
      CLICKHOUSE_PASSWORD: medallion
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env.example
    environment:
      POSTGRES_HOST: postgres
      CLICKHOUSE_HOST: clickhouse
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pg_data:
  ch_data:
